<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>하이브리드 앱 테스트 페이지</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 24px; line-height: 1.5; }
    button, a.link { display: block; width: 100%; box-sizing: border-box; padding: 14px; margin: 10px 0;
                     font-size: 16px; border-radius: 10px; border: 1px solid #ccc; background: #f5f5f7;
                     color: #000; text-align: center; text-decoration: none; }
    #status { padding: 10px; border-radius: 8px; background: #eef; }
    .info { font-size: 12px; color: #555; word-break: break-all; }
    #log { white-space: pre-wrap; background: #111; color: #0f0; padding: 12px;
           border-radius: 8px; min-height: 140px; font-size: 13px; word-break: break-all; }
  </style>
</head>
<body>
  <h2>하이브리드 앱 테스트 페이지</h2>
  <p id="status"></p>
  <p class="info" id="address"></p>
  <p class="info" id="ua"></p>

  <h3>브릿지</h3>
  <button onclick="send('getAppInfo')">앱 버전 (getAppInfo)</button>
  <button onclick="send('getDeviceInfo')">기기 정보 (getDeviceInfo)</button>
  <button onclick="send('getLocation')">현재 위치 (getLocation)</button>
  <button onclick="send('getPushToken')">푸시 토큰 (getPushToken)</button>
  <button onclick="send('dance')">앱이 모르는 부탁 (dance)</button>

  <h3>링크</h3>
  <a class="link" href="./?from=inside">앱 안에서 열리는 링크 (우리 사이트)</a>
  <a class="link" href="https://www.apple.com/kr/">밖으로 나가는 링크 (다른 사이트)</a>
  <a class="link" href="./?from=newwindow" target="_blank">새 창으로 여는 링크 (target=_blank)</a>

  <h3>기록</h3>
  <div id="log"></div>

  <script>
    // 웹과 앱이 약속한 통로 이름 (앱의 AppConfig.bridgeName과 같아야 해요)
    var BRIDGE_NAME = 'myAppBridge';
    var requestNumber = 0;

    // 앱이 만들어 준 통로를 찾아요. 일반 브라우저에는 없어요.
    function bridge() {
      if (window.webkit && window.webkit.messageHandlers) {
        return window.webkit.messageHandlers[BRIDGE_NAME];
      }
      return undefined;
    }

    function writeLog(text) {
      var log = document.getElementById('log');
      log.textContent = text + '\n' + log.textContent;
    }

    // 웹 → 앱: 부탁 보내기
    function send(action) {
      requestNumber += 1;
      var message = { action: action, requestId: 'r' + requestNumber };
      var target = bridge();
      if (!target) {
        writeLog('보내기 실패 (통로 없음): ' + JSON.stringify(message));
        return;
      }
      target.postMessage(message);
      writeLog('웹 → 앱: ' + JSON.stringify(message));
    }

    // 앱 → 웹: 앱이 대답할 때 이 함수를 불러요 (앱의 AppConfig.bridgeResponseFunctionName과 같아야 해요)
    window.onAppResponse = function (response) {
      writeLog('앱 → 웹: ' + JSON.stringify(response));
    };

    document.getElementById('status').textContent = bridge()
      ? '✅ 앱 안에서 열렸어요 (통로 연결됨)'
      : 'ℹ️ 통로가 없어요 (일반 브라우저)';
    document.getElementById('address').textContent = '현재 주소: ' + location.href;
    document.getElementById('ua').textContent = '내 User-Agent: ' + navigator.userAgent;
  </script>
</body>
</html>
